[project]
name = "inky_pi"
version = "0.2.0"
description = "Top-level package for inky-pi."
readme = "README.rst"
requires-python = ">=3.9,<4"
license = { text = "MIT" }
authors = [
    { name = "Mickey Kim", email = "mickeykkim@gmail.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "Pillow>=10.2.0,<11.0.0",
    "RPi.GPIO>=0.7.0,<0.8.0; platform_machine == 'armv7l'",
    "click>=8.1.7,<9.0.0",
    "environs>=10.3.0,<11.0.0",
    "flask>=3.0.2,<4.0.0",
    "flask-wtf>=1.2.1,<2.0.0",
    "font-fredoka-one>=0.0.4,<0.1.0",
    "font-hanken-grotesk>=0.0.2,<0.1.0",
    "inky>=1.2.0,<2.0.0; platform_machine == 'armv7l'",
    "loguru>=0.7.2,<0.8.0",
    "numpy~=1.22",
    "pydantic>=2.6.3,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "rich>=13.7.1,<14.0.0",
    "setuptools>=69.1.1,<70.0.0",
    "urllib3>=2.2.1,<3.0.0",
    "zeep>=4.2.1,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.7,<2.0.0",
    "black>=24.3.0,<25.0.0",
    "bumpversion>=0.6.0,<0.7.0",
    "coverage>=6.3.2,<7.0.0",
    "flake8>=6.1.0,<7.0.0",
    "flake8-bugbear>=23.7.10,<24.0.0",
    "flake8-pyproject>=1.2.3,<2.0.0",
    "importlib-metadata>=4.0.0,<5.0.0",
    "invoke>=2.0.0,<3.0.0",
    "mypy>=1.8,<2.0",
    "pre-commit>=2.17.0,<3.0.0",
    "pylint>=2.0,<3.0",
    "pytest>=7.1.3,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "ruff>=0.0.257,<0.1.0",
    "safety>=2.1.1,<3.0.0",
    "sphinx>=5.2.3,<6.0.0",
    "sphinx-rtd-theme>=1.0.0,<2.0.0",
    "ssort>=0.11.6,<0.12.0",
    "tox>=4.0.0,<5.0.0",
    "types-pillow>=10.2.0.20240213",
    "types-requests>=2.25.8,<3.0.0",
]

[project.scripts]
inky_pi = "inky_pi.cli:main"

[project.urls]
Homepage = "https://github.com/mickeykkim/inky_pi"

[tool]

[tool.flake8]
ignore = ['E203', 'W503']
max-complexity = 10
max-line-length = 88
per-file-ignores = [
  '*/__init__.py:F401',
  'tests/*:E501,B950',
  'tasks.py:E501,B950',
]
select = ['B', 'C', 'E', 'F', 'W', 'T4', 'B9']

[tool.pytest.ini_options]
filterwarnings = "ignore::DeprecationWarning"
markers = [
  "integration", # end-to-end tests
  "e2e",
]
minversion = "6.0"
norecursedirs = [
  "docs",
  "dist",
  "build",
  "venv",
  "bin",
  "lib",
  "include",
  "share",
  "local",
  "tmp",
  "tmp.*",
  ".*",
  "*.egg-info",
  "*.egg-info/*",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["tasks.py", "run_flask_app.py", "tests/*"]
source = ["inky_pi", "flask_app"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover", # Don't complain about missing debug-only code:
  "def __repr__",
  "if self.debug", # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError", # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:", # Don't complain about abstract methods, they aren't run:
  "@abstractmethod",
  "@abc.abstractmethod",
]
ignore_errors = true
omit = [
  "tests/*",
  "venv/*",
  "bin/*",
  "lib/*",
  "include/*",
  "share/*",
  "local/*",
  "tmp/*",
  "tmp.*/*",
  ".*/*",
  "*.egg-info/*",
]
precision = 2
skip_empty = true

[tool.coverage.html]
directory = "bin/coverage_html"
skip_empty = true

[tool.black]
line-length = 88
preview = true

[tool.isort]
profile = "black"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "flask_wtf.*",
  "wtforms.*",
]

[tool.ruff]
ignore = []
select = ["E", "F", "G", "B", "Q", "W"]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G"]
unfixable = []
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "__pycache__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "bin",
]
# Same as Black.
line-length = 88
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Assume Python 3.10.
target-version = "py310"
[tool.ruff.mccabe]
max-complexity = 7

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.tox]
legacy_tox_ini = """
[tox]
isolated_build = true
envlist = py3.9, py3.10, py3.11, docs

[testenv:py3.9]
basepython=python3.9

[testenv:py3.10]
basepython=python3.10

[testenv:py3.11]
basepython=python3.11

[testenv]
description = Run compliance tests
allowlist_externals = poetry, invoke
setenv =
    PIP_EXTRA_INDEX_URL = https://www.piwheels.org/simple/
require_locked_deps = true
install_dev_deps = true
commands =
    invoke format --check
    invoke lint
    invoke security
    invoke test --junit --coverage

[testenv:docs]
description = Build documentation
allowlist_externals = poetry, invoke
setenv =
    PIP_EXTRA_INDEX_URL = https://www.piwheels.org/simple/
require_locked_deps = true
install_dev_deps = true
commands =
    invoke docs --no-launch
"""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
