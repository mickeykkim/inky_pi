# GitHub Actions workflow for installing uv and running Tox

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push (all branches) or pull requests (only for main branch)
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build and run compliance tests
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ "3.9", "3.10", "3.11.1"]

    steps:
      # Checkout out repo and setup python
      - name: Check out repository
        uses: actions/checkout@v4.1.2

      - name: Setup Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Load cached venv if cache exists
      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('**/uv.lock') }}

      # Install dependencies
      - name: Install dependencies
        run: uv sync --all-extras

      # Save api keys to .env file
      - name: Create .env file
        run: |
          echo TRAIN_API_TOKEN=${{ secrets.TRAIN_API_TOKEN }} > .env
          echo WEATHER_API_TOKEN=${{ secrets.WEATHER_API_TOKEN }} >> .env

      # Run tox
      - name: Run Tox
        run: uv run tox -e py
